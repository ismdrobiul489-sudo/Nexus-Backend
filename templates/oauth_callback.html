<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube OAuth Callback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 24px;
        }

        p {
            margin: 0;
            opacity: 0.8;
            font-size: 14px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon" id="icon">🔄</div>
        <h1 id="title"><span class="loading"></span>Processing...</h1>
        <p id="message">Please wait while we complete the authentication.</p>
    </div>

    <script>
        // Send auth result to parent window via postMessage
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        const error = params.get('error');

        const icon = document.getElementById('icon');
        const title = document.getElementById('title');
        const message = document.getElementById('message');

        if (error) {
            icon.textContent = '❌';
            title.innerHTML = '<span class="error">Authentication Failed</span>';
            message.textContent = error === 'access_denied'
                ? 'You denied the access request.'
                : `Error: ${error}`;

            // Send error to parent
            if (window.opener) {
                window.opener.postMessage({ type: 'youtube_oauth_error', error: error }, '*');
            }
        } else if (code) {
            icon.textContent = '✅';
            title.innerHTML = '<span class="success">Authentication Successful!</span>';
            message.textContent = 'Completing authorization...';

            // Send code to parent window
            if (window.opener) {
                window.opener.postMessage({
                    type: 'youtube_oauth_callback',
                    code: code,
                    state: state
                }, '*');

                message.textContent = 'This window will close automatically...';

                // Close after short delay
                setTimeout(() => {
                    window.close();
                }, 1500);
            } else {
                message.textContent = 'Error: Parent window not found. Please close this window and try again.';
            }
        } else {
            icon.textContent = '❓';
            title.textContent = 'No Response';
            message.textContent = 'No authorization code received. Please try again.';
        }
    </script>
</body>

</html>
