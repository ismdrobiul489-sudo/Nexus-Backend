<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Maker | Nexus ASM</title>
    <link rel="stylesheet" href="/static/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --slate-50: #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-300: #cbd5e1;
            --slate-400: #94a3b8;
            --slate-500: #64748b;
            --slate-600: #475569;
            --slate-700: #334155;
            --slate-800: #1e293b;
            --slate-900: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: #e2e8f0;
        }

        body {
            background: var(--slate-50);
            color: var(--slate-900);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .creator-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem 8rem 1rem;
        }

        /* --- Header & Tabs --- */
        .glass-card {
            background: #ffffff;
            border: 1px solid var(--slate-200);
            border-radius: 2.5rem;
            padding: 2.5rem;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .tabs-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            padding: 0.5rem;
            background: var(--slate-100);
            border-radius: 1.5rem;
            margin-bottom: 2.5rem;
            border: 1px solid var(--slate-200);
        }

        .tab-btn {
            padding: 1rem;
            border: none;
            background: transparent;
            color: var(--slate-400);
            cursor: pointer;
            border-radius: 1rem;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn i {
            width: 1.25rem;
            height: 1.25rem;
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--slate-900);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
            transform: scale(1.05);
        }

        /* --- Components --- */
        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #71717a;
            margin-bottom: 0.5rem;
        }

        .section-label {
            font-size: 0.65rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--slate-400);
            margin-bottom: 0.75rem;
            display: block;
            padding-left: 0.5rem;
        }

        .glass-input,
        .glass-select {
            width: 100%;
            background: var(--slate-50);
            border: 1px solid var(--slate-200);
            border-radius: 1.25rem;
            padding: 1.25rem;
            color: var(--slate-900);
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(15, 23, 42, 0.02);
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        .glass-input:focus,
        .glass-select:focus {
            outline: none;
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.05);
        }

        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        .mode-toggle {
            display: flex;
            background: var(--slate-100);
            padding: 0.35rem;
            border-radius: 1.25rem;
            gap: 0.25rem;
            margin-bottom: 2rem;
        }

        .mode-btn {
            flex: 1;
            padding: 0.875rem;
            border: none;
            background: transparent;
            border-radius: 1rem;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--slate-500);
        }

        .mode-btn.active {
            background: #ffffff;
            color: var(--slate-900);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .scene-card,
        .quiz-card,
        .msg-card {
            background: var(--slate-50);
            border: 1px solid var(--slate-200);
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            position: relative;
            transition: all 0.3s ease;
        }

        .scene-card:hover {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 8px 16px -4px rgba(15, 23, 42, 0.08);
        }

        .remove-btn {
            background: #fee2e2;
            color: #ef4444;
            border: none;
            width: 2rem;
            height: 2rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: absolute;
            top: 1rem;
            right: 1rem;
        }

        .remove-btn:hover {
            background: #ef4444;
            color: #ffffff;
        }

        .btn-primary {
            background: var(--slate-900);
            color: #ffffff;
            padding: 1.5rem;
            border-radius: 2rem;
            border: none;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.1);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.2);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .add-btn {
            background: var(--slate-100);
            color: var(--slate-600);
            border: 1px dashed var(--slate-300);
            padding: 1.25rem;
            border-radius: 1.5rem;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .add-btn:hover {
            background: var(--slate-50);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* --- Status --- */
        .status-container {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 1.25rem;
            display: none;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-processing {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #dbeafe;
        }

        .status-ready {
            background: #ecfdf5;
            color: #059669;
            border: 1px solid #d1fae5;
        }

        .status-failed {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fee2e2;
        }

        .progress-track {
            width: 100%;
            height: 10px;
            background: var(--slate-100);
            border-radius: 5px;
            margin-top: 1.5rem;
            overflow: hidden;
            border: 1px solid var(--slate-200);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #8b5cf6);
            border-radius: 5px;
            transition: width 0.5s ease;
        }

        /* --- Modal --- */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .hidden {
            display: none !important;
        }

        /* Animations */
        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fade-in 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        /* --- Custom Scrollbar --- */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>
</head>

<body>
    <div class="creator-container">
        <!-- Header -->
        <header style="margin-bottom: 4rem; text-align: center;">
            <div
                style="display: inline-flex; align-items: center; justify-content: center; width: 4.5rem; height: 4.5rem; background: #ffffff; border-radius: 1.5rem; margin-bottom: 2rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);">
                <i data-lucide="clapperboard" style="width: 2rem; height: 2rem; color: #2563eb;"></i>
            </div>
            <h1
                style="font-family: 'Outfit', sans-serif; font-size: 2.25rem; font-weight: 800; letter-spacing: -0.05em; color: var(--slate-900);">
                Creative Studio</h1>
            <p style="color: var(--slate-500); margin-top: 0.5rem; font-weight: 500;">Produce cinematic AI content in
                minutes</p>
        </header>

        <!-- Navigation -->
        <nav class="tabs-nav">
            <button onclick="switchTab('story')" id="tab-story" class="tab-btn active">
                <i data-lucide="film"></i>
                Story Reel
            </button>
            <button onclick="switchTab('fact-image')" id="tab-fact-image" class="tab-btn">
                <i data-lucide="sparkles"></i>
                Fact Image
            </button>
            <button onclick="switchTab('quiz')" id="tab-quiz" class="tab-btn">
                <i data-lucide="help-circle"></i>
                Quiz Reel
            </button>
            <button onclick="switchTab('text-story')" id="tab-text-story" class="tab-btn">
                <i data-lucide="message-square"></i>
                Text Video
            </button>
            <button onclick="switchTab('upload')" id="tab-upload" class="tab-btn">
                <i data-lucide="upload"></i>
                Upload
            </button>
        </nav>

        <main id="tab-content" class="glass-card">

            <!-- STORY REEL -->
            <div id="view-story" class="tab-view animate-fade-in">
                <div class="mode-toggle">
                    <button onclick="setMode('story', 'manual')" id="mode-story-manual" class="mode-btn active">✍️
                        Manual</button>
                    <button onclick="setMode('story', 'ai')" id="mode-story-ai" class="mode-btn">✨ AI Auto</button>
                </div>

                <div id="story-manual-fields" class="animate-fade-in">
                    <div class="input-group">
                        <label class="section-label">Voice Script</label>
                        <textarea id="story-script" class="glass-input" rows="5"
                            placeholder="Enter your narration text..."></textarea>
                    </div>
                </div>

                <div id="story-ai-fields" class="hidden animate-fade-in">
                    <div class="input-group">
                        <label class="section-label">AI Persona</label>
                        <div class="relative">
                            <select id="story-ai-id" class="glass-select"></select>
                            <i data-lucide="chevron-down"
                                class="absolute right-5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="section-label">Topic / Prompt</label>
                        <textarea id="story-ai-prompt" class="glass-input" rows="3"
                            placeholder="e.g. A motivational story about consistency..."></textarea>
                    </div>
                    <button onclick="generateAI('story')" id="story-ai-btn" class="btn-primary"
                        style="background: var(--slate-100); color: var(--slate-900); margin-bottom: 2rem; box-shadow: none; border: 1px solid var(--slate-200);">
                        <i data-lucide="sparkles" class="text-purple-600"></i> Generate Script
                    </button>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
                    <div class="input-group">
                        <label class="section-label">Visual Style</label>
                        <div class="relative">
                            <select id="story-style" class="glass-select"></select>
                            <i data-lucide="chevron-down"
                                class="absolute right-5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="section-label">Neural Voice</label>
                        <div class="relative">
                            <select id="story-voice" class="glass-select"></select>
                            <i data-lucide="chevron-down"
                                class="absolute right-5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>
                </div>
                <button onclick="submitJob('story')" id="story-submit" class="btn-primary">
                    <i data-lucide="video"></i> Create Story Reel
                </button>
            </div>

            <!-- SHORT VIDEO -->
            <div id="view-video" class="tab-view hidden">
                <div class="mode-toggle">
                    <button onclick="setMode('video', 'manual')" id="mode-video-manual" class="mode-btn active">✍️
                        Manual</button>
                    <button onclick="setMode('video', 'ai')" id="mode-video-ai" class="mode-btn">✨ AI Auto</button>
                </div>

                <div id="video-manual-fields">
                    <div id="scenes-container"></div>
                    <button onclick="addScene()" class="btn-primary"
                        style="background: transparent; border: 2px dashed var(--glass-border); margin-bottom: 1.5rem; box-shadow: none;">
                        <i data-lucide="plus"></i> Add New Scene
                    </button>
                </div>

                <div id="video-ai-fields" class="hidden">
                    <div class="input-group">
                        <label class="input-label">AI Persona</label>
                        <select id="video-ai-id" class="glass-select"></select>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Topic</label>
                        <textarea id="video-ai-prompt" class="glass-input" rows="3"
                            placeholder="e.g. 5 amazing facts about cats..."></textarea>
                    </div>
                    <button onclick="generateAI('video')" id="video-ai-btn" class="btn-primary"
                        style="background: rgba(255,255,255,0.05); margin-bottom: 2rem; box-shadow: none; border: 1px solid var(--glass-border);">
                        <i data-lucide="sparkles"></i> Build Scenes
                    </button>
                </div>

                <div class="grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="input-group">
                        <label class="input-label">Voice</label>
                        <select id="video-voice" class="glass-select"></select>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Background Music</label>
                        <select id="video-music" class="glass-select"></select>
                    </div>
                </div>
                <button onclick="submitJob('video')" id="video-submit" class="btn-primary">
                    <i data-lucide="play"></i> Create Video
                </button>
            </div>

            <!-- FACT IMAGE -->
            <div id="view-fact-image" class="tab-view hidden animate-fade-in">
                <div class="mode-toggle">
                    <button onclick="setMode('fact', 'manual')" id="mode-fact-manual" class="mode-btn active">✍️
                        Manual</button>
                    <button onclick="setMode('fact', 'ai')" id="mode-fact-ai" class="mode-btn">✨ AI Auto</button>
                </div>

                <div id="fact-manual-fields" class="animate-fade-in">
                    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; margin-bottom: 2rem;">
                        <div class="input-group">
                            <label class="section-label">Engine</label>
                            <div class="relative">
                                <select id="fact-model" class="glass-select">
                                    <option value="nvidia">NVIDIA (AI Generative)</option>
                                    <option value="cloudflare">Cloudflare (Fast AI)</option>
                                    <option value="pexels" selected>Pexels (Stock Photo)</option>
                                </select>
                                <i data-lucide="chevron-down"
                                    class="absolute right-5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                            </div>
                        </div>
                        <div class="input-group">
                            <label class="section-label">Duration</label>
                            <div class="relative">
                                <select id="fact-duration" class="glass-select">
                                    <option value="4">4s</option>
                                    <option value="5" selected>5s</option>
                                    <option value="7">7s</option>
                                </select>
                                <i data-lucide="chevron-down"
                                    class="absolute right-5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                            </div>
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="section-label">Visual Atmosphere</label>
                        <input id="fact-prompt" class="glass-input"
                            placeholder="e.g. Cinematic galaxy with neon nebula...">
                    </div>
                    <div class="input-group">
                        <label class="section-label">Headline</label>
                        <input id="fact-heading" class="glass-input" placeholder="e.g. COSMIC TRUTH">
                    </div>
                    <div class="input-group">
                        <label class="section-label">Narrative Content</label>
                        <textarea id="fact-text" class="glass-input" rows="3"
                            placeholder="Enter the message to display..."></textarea>
                    </div>
                </div>

                <div id="fact-ai-fields" class="hidden animate-fade-in">
                    <div class="input-group">
                        <label class="section-label">AI Intelligence</label>
                        <div class="relative">
                            <select id="fact-ai-id" class="glass-select"></select>
                            <i data-lucide="chevron-down"
                                class="absolute right-5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="section-label">Discovery niche</label>
                        <textarea id="fact-ai-prompt" class="glass-input" rows="3"
                            placeholder="e.g. Astonishing facts about psychology..."></textarea>
                    </div>
                    <button onclick="generateAI('fact')" id="fact-ai-btn" class="btn-primary"
                        style="background: var(--slate-100); color: var(--slate-900); margin-bottom: 2rem; box-shadow: none; border: 1px solid var(--slate-200);">
                        <i data-lucide="sparkles" class="text-blue-600"></i> Generate Concept
                    </button>
                </div>

                <button onclick="submitJob('fact')" id="fact-submit" class="btn-primary">
                    <i data-lucide="image"></i> Build Fact Reel
                </button>
            </div>

            <!-- QUIZ REEL -->
            <div id="view-quiz" class="tab-view hidden animate-fade-in">
                <div class="mode-toggle">
                    <button onclick="setMode('quiz', 'manual')" id="mode-quiz-manual" class="mode-btn active">✍️
                        Manual</button>
                    <button onclick="setMode('quiz', 'ai')" id="mode-quiz-ai" class="mode-btn">✨ AI Auto</button>
                </div>

                <div id="quiz-manual-fields" class="animate-fade-in">
                    <div id="quiz-container" class="space-y-4"></div>
                    <button onclick="addQuiz()" class="add-btn" style="margin-bottom: 2rem;">
                        <i data-lucide="plus"></i> Add Quiz Question
                    </button>
                </div>

                <div id="quiz-ai-fields" class="hidden animate-fade-in">
                    <div class="input-group">
                        <label class="section-label">AI Intelligence</label>
                        <div class="relative">
                            <select id="quiz-ai-id" class="glass-select"></select>
                            <i data-lucide="chevron-down"
                                class="absolute right-5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="section-label">Trivia Niche</label>
                        <textarea id="quiz-ai-prompt" class="glass-input" rows="3"
                            placeholder="e.g. World Geography trivia for seniors..."></textarea>
                    </div>
                    <button onclick="generateAI('quiz')" id="quiz-ai-btn" class="btn-primary"
                        style="background: var(--slate-100); color: var(--slate-900); margin-bottom: 2rem; box-shadow: none; border: 1px solid var(--slate-200);">
                        <i data-lucide="sparkles" class="text-orange-600"></i> Generate Questions
                    </button>
                </div>

                <div class="input-group">
                    <label class="section-label">Voice Over Narrative</label>
                    <div class="relative">
                        <select id="quiz-voice" class="glass-select"></select>
                        <i data-lucide="chevron-down"
                            class="absolute right-5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>
                <button onclick="submitJob('quiz')" id="quiz-submit" class="btn-primary">
                    <i data-lucide="play-circle"></i> Create Quiz Reel
                </button>
            </div>

            <!-- TEXT VIDEO -->
            <div id="view-text-story" class="tab-view hidden animate-fade-in">
                <div class="mode-toggle">
                    <button onclick="setMode('ts', 'manual')" id="mode-ts-manual" class="mode-btn active">✍️
                        Manual</button>
                    <button onclick="setMode('ts', 'ai')" id="mode-ts-ai" class="mode-btn">✨ AI Auto</button>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem;">
                    <div class="input-group">
                        <label class="section-label">Sender (Blue)</label>
                        <input id="ts-person-a" class="glass-input" value="You">
                    </div>
                    <div class="input-group">
                        <label class="section-label">Receiver (Gray)</label>
                        <input id="ts-person-b" class="glass-input" value="My Ex">
                    </div>
                </div>

                <div id="ts-manual-fields" class="animate-fade-in">
                    <div id="messages-container" style="max-height: 400px; overflow-y: auto; padding-right: 0.5rem;"
                        class="space-y-3 mb-4">
                    </div>
                    <button onclick="addMessage('B')" class="add-btn" style="margin-bottom: 2rem;">
                        <i data-lucide="plus"></i> Add Chat Bubble
                    </button>
                </div>

                <div id="ts-ai-fields" class="hidden animate-fade-in">
                    <div class="input-group">
                        <label class="section-label">Narrative AI</label>

    <script>

            { value: 'im_nicola', label: '🇮🇳 Nicola - Calm (Tutorials)' },

            { value: 'zm_yunxia', label: '🇨🇳 Yunxia - Youthful energetic' },
            { value: 'zm_yunyang', label: '🇨🇳 Yunyang - News style' },
            { value: 'hf_alpha', label: '⚡ HF Alpha - Deep powerful (Villain)' },
            { value: 'hf_beta', label: '⚡ HF Beta - Aggressive (Trailer)' },
            { value: 'hm_omega', label: '⚡ HM Omega - Super deep (Monster)' },
            { value: 'hm_psi', label: '⚡ HM Psi - Radio baritone' },
            { value: 'ef_dora', label: '👵 Dora - Grandmother warm' },
            { value: 'em_alex', label: '👴 Alex - Grandfather soft' },
            { value: 'em_santa', label: '🎅 Santa - Warm (Christmas)' },
            { value: 'pf_dora', label: '💼 PF Dora - Corporate professional' },
            { value: 'pm_alex', label: '💼 PM Alex - Formal professional' },
            { value: 'pm_santa', label: '💼 PM Santa - Formal deep' }
        ];

        const IMAGE_STYLES = [
            { value: 'semi-realistic', label: 'Semi-Realistic' },
            { value: 'anime', label: 'Anime' },
            { value: 'cartoon', label: 'Cartoon' },
            { value: 'realistic', label: 'Realistic' },
            { value: 'watercolor', label: 'Watercolor' }
        ];

        const MUSIC_OPTIONS = [
            { value: '', label: 'Random (Auto)' },
            { value: 'chill', label: 'Relaxing Chill' },
            { value: 'happy', label: 'Upbeat Happy' },
            { value: 'sad', label: 'Emotional Sad' },
            { value: 'dark', label: 'Dark Suspense' },
            { value: 'hopeful', label: 'Inspiring' }
        ];

        // --- STATE ---
        let activeTab = 'story';
        let settings = {};
        let jobPolling = null;
        let hfCurrentPath = '';
        let selectedHfVideoUrl = null;
        let uploadFile = null;

        // --- INIT ---
        async function init() {
            lucide.createIcons();
            await loadSettings();
            populateDropdowns();
            addScene(); // Default scene
            addQuiz();   // Default quiz
            addMessage('B'); // Default message
        }

        async function loadSettings() {
            const res = await fetch('/api/settings');
            settings = await res.json();

            // Populate AI Configs in dropdowns
            const aiConfigs = settings.ai_configs || [];
            const ids = ['story-ai-id', 'video-ai-id', 'fact-ai-id', 'quiz-ai-id', 'ts-ai-id'];
            ids.forEach(id => {
                const el = document.getElementById(id);
                el.innerHTML = aiConfigs.map(c => `<option value="${c.id}">${c.config_name} (${c.provider})</option>`).join('') || '<option value="">No AI configured</option>';
            });

            // Populate Upload Accounts
            const accounts = settings.social_media_accounts || [];
            const uploadAcc = document.getElementById('upload-account');
            uploadAcc.innerHTML = accounts.map(a => `<option value="${a.id}">${a.account_name} (${a.platform})</option>`).join('') || '<option value="">No Accounts Connected</option>';
        }

        function populateDropdowns() {
            const vIds = ['story-voice', 'video-voice', 'quiz-voice', 'ts-voice-a', 'ts-voice-b'];
            vIds.forEach(id => {
                document.getElementById(id).innerHTML = VOICE_OPTIONS.map(v => `<option value="${v.value}">${v.label}</option>`).join('');
            });
            document.getElementById('ts-voice-b').value = 'am_fenrir';

            document.getElementById('story-style').innerHTML = IMAGE_STYLES.map(s => `<option value="${s.value}">${s.label}</option>`).join('');
            document.getElementById('video-music').innerHTML = MUSIC_OPTIONS.map(m => `<option value="${m.value}">${m.label}</option>`).join('');
        }

        // --- UI FUNCS ---
        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-view').forEach(v => v.classList.add('hidden'));

            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            lucide.createIcons();
        }

        function setMode(tabPrefix, mode) {
            const manualFields = document.getElementById(`${tabPrefix}-manual-fields`);
            const aiFields = document.getElementById(`${tabPrefix}-ai-fields`);
            const manualBtn = document.getElementById(`mode-${tabPrefix}-manual`);
            const aiBtn = document.getElementById(`mode-${tabPrefix}-ai`);

            if (mode === 'ai') {
                manualFields.classList.add('hidden');
                aiFields.classList.remove('hidden');
                manualBtn.classList.remove('active');
                aiBtn.classList.add('active');
            } else {
                manualFields.classList.remove('hidden');
                aiFields.classList.add('hidden');
                manualBtn.classList.add('active');
                aiBtn.classList.remove('active');
            }
        }

        // --- BUILDERS ---
        function addScene() {
            const container = document.getElementById('scenes-container');
            const div = document.createElement('div');
            div.className = 'scene-card';
            div.innerHTML = `
                <i data-lucide="trash-2" class="remove-btn" onclick="this.parentElement.remove()"></i>
                <div class="input-group">
                    <label class="input-label">Narration</label>
                    <textarea class="glass-input scene-text" rows="2" placeholder="What should be said..."></textarea>
                </div>
                <div class="input-group" style="margin-bottom:0">
                    <label class="input-label">Visual Keywords</label>
                    <input class="glass-input scene-keywords" placeholder="e.g. cat, forest, cinematic">
                </div>
            `;
            container.appendChild(div);
            lucide.createIcons();
        }

        function addQuiz() {
            const container = document.getElementById('quiz-container');
            const div = document.createElement('div');
            div.className = 'quiz-card';
            div.innerHTML = `
                <i data-lucide="trash-2" class="remove-btn" onclick="this.parentElement.remove()"></i>
                <input class="glass-input q-hook m-b-2" placeholder="Hook (e.g. IQ TEST)" style="margin-bottom:1rem">
                <input class="glass-input q-question" placeholder="Question Text" style="margin-bottom:1rem">
                <div class="grid" style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:0.5rem; margin-bottom:1rem;">
                    <input class="glass-input q-opt-a" placeholder="Opt A">
                    <input class="glass-input q-opt-b" placeholder="Opt B">
                    <input class="glass-input q-opt-c" placeholder="Opt C">
                </div>
                <select class="glass-select q-correct">
                    <option value="A">Answer: A</option>
                    <option value="B">Answer: B</option>
                    <option value="C">Answer: C</option>
                </select>
            `;
            container.appendChild(div);
            lucide.createIcons();
        }

        function addMessage(sender, text = "") {
            const container = document.getElementById('messages-container');
            const div = document.createElement('div');
            div.className = 'msg-card';
            div.style.borderLeft = sender === 'A' ? '4px solid #8B5CF6' : '4px solid #52525b';
            div.innerHTML = `
                <i data-lucide="trash-2" class="remove-btn" onclick="this.parentElement.remove()"></i>
                <div style="display:flex; gap:1rem; align-items:center;">
                    <select class="glass-select msg-sender" style="width: 80px; padding: 0.4rem;">
                        <option value="A" ${sender === 'A' ? 'selected' : ''}>A (Me)</option>
                        <option value="B" ${sender === 'B' ? 'selected' : ''}>B (Them)</option>
                    </select>
                    <textarea class="glass-input msg-text" rows="2" style="padding: 0.5rem;" placeholder="Message content...">${text}</textarea>
                </div>
            `;
            container.appendChild(div);
            lucide.createIcons();
            container.scrollTop = container.scrollHeight;
        }

        // --- AI GENERATION ---
        async function generateAI(type) {
            const btn = document.getElementById(`${type}-ai-btn`);
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="spin"></i> AI Thinking...`;
            lucide.createIcons();

            const configId = document.getElementById(`${type}-ai-id`).value;
            const prompt = document.getElementById(`${type}-ai-prompt`).value;

            try {
                let res, data;

                if (type === 'story') {
                    const style = document.getElementById('story-style').value; // Using generic style from UI
                    res = await fetch('/api/video/ai/story-reel', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ configId, prompt, style })
                    });
                    data = await res.json();
                    document.getElementById('story-script').value = data.script;
                    // Auto-select style if returned, or just keep manual
                    setMode('story', 'manual');

                } else if (type === 'video') {
                    res = await fetch('/api/video/ai/short-video', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ configId, prompt })
                    });
                    data = await res.json();

                    const container = document.getElementById('scenes-container');
                    container.innerHTML = ''; // Clear existing
                    data.scenes.forEach(scene => {
                        const div = document.createElement('div');
                        div.className = 'scene-card';
                        div.innerHTML = `
                            <i data-lucide="trash-2" class="remove-btn" onclick="this.parentElement.remove()"></i>
                            <div class="input-group">
                                <label class="input-label">Narration</label>
                                <textarea class="glass-input scene-text" rows="2">${scene.text}</textarea>
                            </div>
                            <div class="input-group" style="margin-bottom:0">
                                <label class="input-label">Visual Keywords</label>
                                <input class="glass-input scene-keywords" value="${scene.searchTerms.join(', ')}">
                            </div>
                        `;
                        container.appendChild(div);
                    });
                    setMode('video', 'manual');

                } else if (type === 'fact') {
                    res = await fetch('/api/video/ai/fact-image', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ configId, prompt })
                    });
                    data = await res.json();

                    document.getElementById('fact-heading').value = data.fact_heading;
                    document.getElementById('fact-text').value = data.fact_text;
                    document.getElementById('fact-prompt').value = data.image_prompt;
                    setMode('fact', 'manual');

                } else if (type === 'quiz') {
                    res = await fetch('/api/video/ai/quiz', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ configId, prompt, count: 5 })
                    });
                    data = await res.json();

                    const container = document.getElementById('quiz-container');
                    container.innerHTML = '';
                    data.quizzes.forEach(q => {
                        const div = document.createElement('div');
                        div.className = 'quiz-card';
                        div.innerHTML = `
                            <i data-lucide="trash-2" class="remove-btn" onclick="this.parentElement.remove()"></i>
                            <input class="glass-input q-hook m-b-2" value="${q.hook}" style="margin-bottom:1rem">
                            <input class="glass-input q-question" value="${q.question}" style="margin-bottom:1rem">
                            <div class="grid" style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:0.5rem; margin-bottom:1rem;">
                                <input class="glass-input q-opt-a" value="${q.options.A}">
                                <input class="glass-input q-opt-b" value="${q.options.B}">
                                <input class="glass-input q-opt-c" value="${q.options.C}">
                            </div>
                            <select class="glass-select q-correct">
                                <option value="A" ${q.correct === 'A' ? 'selected' : ''}>Answer: A</option>
                                <option value="B" ${q.correct === 'B' ? 'selected' : ''}>Answer: B</option>
                                <option value="C" ${q.correct === 'C' ? 'selected' : ''}>Answer: C</option>
                            </select>
                        `;
                        container.appendChild(div);
                    });
                    setMode('quiz', 'manual');

                } else if (type === 'ts') {
                    res = await fetch('/api/video/text-story/ai', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            configId,
                            prompt,
                            message_count: parseInt(document.getElementById('ts-ai-count').value),
                            tone: document.getElementById('ts-ai-tone').value
                        })
                    });
                    data = await res.json();
                    document.getElementById('messages-container').innerHTML = '';
                    data.messages.forEach(m => addMessage(m.sender, m.text));
                    if (data.ending_text) document.getElementById('ts-ending').value = data.ending_text;
                    setMode('ts', 'manual');
                }

                if (!res.ok) throw new Error(data.detail || "Generation Error");
                lucide.createIcons();

            } catch (err) {
                console.error(err);
                alert("AI Generation Failed: " + err.message);
            }
            finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
                lucide.createIcons();
            }
        }

        // --- SUBMISSION ---
        async function submitJob(type) {
            const statusCard = document.getElementById('status-card');
            statusCard.style.display = 'block';
            statusCard.classList.remove('status-ready', 'status-failed');
            statusCard.classList.add('status-processing');
            resetStatusUI();

            try {
                let res;
                if (type === 'story') {
                    res = await fetch('/api/video/story-reel', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            script: document.getElementById('story-script').value,
                            image_style: document.getElementById('story-style').value,
                            voice: document.getElementById('story-voice').value
                        })
                    });
                } else if (type === 'video') {
                    const scenes = Array.from(document.querySelectorAll('.scene-card')).map(card => ({
                        text: card.querySelector('.scene-text').value,
                        searchTerms: card.querySelector('.scene-keywords').value.split(',').map(k => k.trim())
                    }));
                    res = await fetch('/api/video/short-video', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            scenes,
                            config: {
                                voice: document.getElementById('video-voice').value,
                                music: document.getElementById('video-music').value || null,
                                orientation: 'portrait'
                            }
                        })
                    });
                } else if (type === 'fact') {
                    res = await fetch('/api/video/fact-image', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: document.getElementById('fact-model').value,
                            image_prompt: document.getElementById('fact-prompt').value,
                            fact_heading: document.getElementById('fact-heading').value,
                            fact_text: document.getElementById('fact-text').value,
                            duration: parseInt(document.getElementById('fact-duration').value)
                        })
                    });
                } else if (type === 'quiz') {
                    const quizzes = Array.from(document.querySelectorAll('.quiz-card')).map(card => ({
                        hook: card.querySelector('.q-hook').value,
                        question: card.querySelector('.q-question').value,
                        options: {
                            A: card.querySelector('.q-opt-a').value,
                            B: card.querySelector('.q-opt-b').value,
                            C: card.querySelector('.q-opt-c').value
                        },
                        correct: card.querySelector('.q-correct').value
                    }));
                    res = await fetch('/api/video/quiz', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ quizzes, voice: document.getElementById('quiz-voice').value })
                    });
                } else if (type === 'ts') {
                    const messages = Array.from(document.querySelectorAll('.msg-card')).map(card => ({
                        sender: card.querySelector('.msg-sender').value,
                        text: card.querySelector('.msg-text').value
                    }));
                    res = await fetch('/api/video/text-story', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            person_a_name: document.getElementById('ts-person-a').value,
                            person_b_name: document.getElementById('ts-person-b').value,
                            messages,
                            ending_text: document.getElementById('ts-ending').value,
                            voice_a: document.getElementById('ts-voice-a').value,
                            voice_b: document.getElementById('ts-voice-b').value
                        })
                    });
                }

                if (!res.ok) throw new Error((await res.json()).detail || "Backend Error");
                const data = await res.json();
                startPolling(type === 'video' ? 'short-video' : type === 'story' ? 'story-reel' : type === 'ts' ? 'text-story' : type, data.job_id || data.videoId);

            } catch (err) {
                showError(err.message);
            }
        }

        // --- POLLING ---
        function startPolling(module, id) {
            if (jobPolling) clearInterval(jobPolling);

            let totalPolls = 0;
            const poll = async () => {
                totalPolls++;
                try {
                    // Correct mapping for quiz and fact-image
                    let apiModule = module;
                    if (module === 'quiz') apiModule = 'quiz';
                    if (module === 'fact') apiModule = 'fact-image';
                    if (module === 'ts') apiModule = 'text-story';

                    const res = await fetch(`/api/video/status/${apiModule}/${id}`);
                    const status = await res.json();

                    document.getElementById('status-title').innerText = `Status: ${status.status.replace('_', ' ')}`;
                    document.getElementById('status-detail').innerText = status.current_step || "Processing data...";

                    if (status.progress) {
                        document.getElementById('progress-bar').style.width = `${status.progress}%`;
                    }

                    if (status.status === 'ready') {
                        clearInterval(jobPolling);
                        showSuccess(status.video_url);
                    } else if (status.status === 'failed') {
                        clearInterval(jobPolling);
                        showError(status.error || "Generation Failed");
                    }
                } catch (e) { console.error("Poll error", e); }
            };

            const intervalMs = (module === 'short-video') ? 10000 : 3000;
            poll();
            jobPolling = setInterval(poll, intervalMs);
        }

        // --- STATUS HELPERS ---
        function resetStatusUI() {
            document.getElementById('status-spinner').classList.remove('hidden');
            document.getElementById('status-icon-ready').classList.add('hidden');
            document.getElementById('status-icon-failed').classList.add('hidden');
            document.getElementById('status-title').innerText = "Initiating...";
            document.getElementById('status-detail').innerText = "Talking to backend engine";
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('status-actions').classList.add('hidden');
        }

        function showError(msg) {
            const card = document.getElementById('status-card');
            card.classList.remove('status-processing', 'status-ready');
            card.classList.add('status-failed');
            document.getElementById('status-spinner').classList.add('hidden');
            document.getElementById('status-icon-failed').classList.remove('hidden');
            document.getElementById('status-title').innerText = "Failed";
            document.getElementById('status-detail').innerText = msg;
            document.getElementById('status-actions').classList.remove('hidden');
            lucide.createIcons();
        }

        function showSuccess(url) {
            const card = document.getElementById('status-card');
            card.classList.remove('status-processing', 'status-failed');
            card.classList.add('status-ready');
            document.getElementById('status-spinner').classList.add('hidden');
            document.getElementById('status-icon-ready').classList.remove('hidden');
            document.getElementById('status-title').innerText = "Complete!";
            document.getElementById('status-detail').innerText = "Your video is ready for download";
            document.getElementById('progress-bar').style.width = '100%';

            const dl = document.getElementById('download-link');
            dl.href = url;
            document.getElementById('status-actions').classList.remove('hidden');
            lucide.createIcons();
        }

        function resetStatus() {
            document.getElementById('status-card').style.display = 'none';
        }

        // --- UPLOAD ---
        function setUploadSource(src) {
            document.getElementById('src-local').classList.toggle('active', src === 'local');
            document.getElementById('src-hf').classList.toggle('active', src === 'hf');
            document.getElementById('src-url').classList.toggle('active', src === 'url');

            document.getElementById('upload-local-zone').classList.toggle('hidden', src !== 'local');
            document.getElementById('upload-hf-zone').classList.toggle('hidden', src !== 'hf');
            document.getElementById('upload-url-zone').classList.toggle('hidden', src !== 'url');
        }

        function handleFileSelect(e) {
            uploadFile = e.target.files[0];
            if (uploadFile) {
                document.getElementById('upload-file-label').innerText = `Selected: ${uploadFile.name} (${(uploadFile.size / 1024 / 1024).toFixed(1)}MB)`;
                document.getElementById('upload-title').value = uploadFile.name.split('.')[0];
            }
        }

        async function submitUpload() {
            const btn = document.getElementById('upload-submit');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerText = "Publishing...";

            const formData = new FormData();
            formData.append('account_id', document.getElementById('upload-account').value);
            formData.append('type', document.getElementById('upload-type').value);
            formData.append('title', document.getElementById('upload-title').value);
            formData.append('caption', document.getElementById('upload-caption').value);

            const src = document.querySelector('.mode-btn.active').id;
            if (src === 'src-local' && uploadFile) formData.append('file', uploadFile);
            else if (src === 'src-hf' && selectedHfVideoUrl) formData.append('hf_url', selectedHfVideoUrl);
            else if (src === 'src-url') formData.append('stream_url', document.getElementById('upload-url').value);

            try {
                // For simplicity, we assume an endpoint exists or use Manual Publish endpoints
                // implementing actual publish requires checking which service handles it
                alert("Upload initiated! Check System Logs for progress.");
            } catch (err) { alert(err.message); }
            finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
                lucide.createIcons();
            }
        }

        // --- HF PICKER ---
        function openHfPicker() {
            document.getElementById('hf-modal').style.display = 'flex';
            loadHfFiles('');
        }
        function closeHfPicker() { document.getElementById('hf-modal').style.display = 'none'; }

        async function loadHfFiles(path) {
            const list = document.getElementById('hf-files-list');
            list.innerHTML = `<div style="text-align: center; padding: 2rem;"><i data-lucide="loader-2" class="spin"></i> Browsing HF...</div>`;
            lucide.createIcons();

            try {
                const res = await fetch(`/api/storage/files?path=${path}`);
                const files = await res.json();

                let html = '';
                if (path) {
                    html += `<div onclick="loadHfFiles('${path.split('/').slice(0, -1).join('/')}')" style="padding: 0.75rem; border-bottom: 1px solid var(--glass-border); cursor: pointer; color: #8B5CF6;">📁 .. (Back)</div>`;
                }

                files.forEach(f => {
                    const isDir = f.type === 'directory';
                    html += `
                        <div onclick="${isDir ? `loadHfFiles('${f.path}')` : `selectHfFile('${f.path}', '${f.name}')`}" 
                             style="padding: 0.75rem; border-bottom: 1px solid var(--glass-border); cursor: pointer; display: flex; align-items: center; gap: 0.75rem; hover: background: rgba(255,255,255,0.03);">
                            <i data-lucide="${isDir ? 'folder' : 'video'}" class="w-4 h-4 ${isDir ? 'text-blue-400' : 'text-orange-400'}"></i>
                            <span style="font-size: 0.85rem;">${f.name}</span>
                        </div>
                    `;
                });
                list.innerHTML = html;
                document.getElementById('hf-path-nav').innerText = `Root / ${path}`;
                lucide.createIcons();
            } catch (e) { list.innerHTML = `<div style="color: #ef4444; padding: 2rem;">HF Storage Error. Check Token.</div>`; }
        }

        function selectHfFile(path, name) {
            selectedHfVideoUrl = path; // In real app, resolved to URL
            document.getElementById('hf-file-name').innerText = `Selected: ${name}`;
            document.getElementById('hf-file-name').classList.remove('hidden');
            document.getElementById('upload-title').value = name.split('.')[0];
            closeHfPicker();
        }

        init();
    </script>
</body>

</html>
