version: '3.8'

services:
  backend:
    build: .
    container_name: nexus_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite+aiosqlite:///data/nexus_v2.db
      - JOBS_DB_URL=sqlite:///data/jobs.sqlite
      - ALLOWED_ORIGINS=*
